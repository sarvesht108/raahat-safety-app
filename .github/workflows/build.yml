name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create platform folders
        run: flutter create --platforms=android --project-name raahat_safety .
      - name: Fix Kotlin JVM target mismatch
        run: echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
      - name: Add permissions to AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\
          <uses-permission android:name="android.permission.SEND_SMS"/>\
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\
          <uses-permission android:name="android.permission.WAKE_LOCK"/>\
          <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\
          <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\
          <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>' $MANIFEST
      - name: Bump compileSdk
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
      - name: Disable code shrinking to avoid AlarmManager crash
        run: |
          FILE=android/app/build.gradle.kts
          sed -i '/release {/a\            isMinifyEnabled = false\n            isShrinkResources = false' $FILE
      - name: Enable core library desugaring
        run: |
          FILE=android/app/build.gradle.kts
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' $FILE
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> $FILE
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: raahat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
